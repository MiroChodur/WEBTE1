<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Obedové menu v okolí fakulty</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hlavicka">
    <div class="container">
        <h1>Obedové menu v okolí fakulty</h1>
        <p class="podtitul">Denné menu študentských jedální a reštaurácií na jednom mieste</p>
        <nav aria-label="Hlavná navigácia">
            <ul class="navigacia">
                <li><a href="index.html" aria-current="page">Menu</a></li>
                <li><a href="project.html">O projekte</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container my-4">
    <section aria-labelledby="nadpis-menu">
        <h2 id="nadpis-menu" class="visually-hidden">Denné menu</h2>

        <div id="ovladanie" class="ovladanie">
            <button type="button" id="aktualizovat" class="btn btn-success">Aktualizovať menu</button>
            <button type="button" id="vymazat" class="btn btn-outline-secondary">Vymazať uložené dáta</button>
        </div>

        <div id="tlacidla-dni" class="dni" role="group" aria-label="Deň v týždni">
            <button type="button" class="btn btn-outline-dark" data-den="day-1">Pondelok</button>
            <button type="button" class="btn btn-outline-dark" data-den="day-2">Utorok</button>
            <button type="button" class="btn btn-outline-dark" data-den="day-3">Streda</button>
            <button type="button" class="btn btn-outline-dark" data-den="day-4">Štvrtok</button>
            <button type="button" class="btn btn-outline-dark" data-den="day-5">Piatok</button>
            <button type="button" id="prepni-tyzden" class="btn btn-outline-dark">Celý týždeň</button>
        </div>

        <fieldset class="filtre">
            <legend>Reštaurácie</legend>
            <div id="filtre"></div>
        </fieldset>

        <p id="stav" class="stav" role="status"></p>
        <div id="nacitavanie" class="text-center my-4" hidden>
            <div class="spinner-border text-success" role="status"></div>
            <p>Načítavam menu…</p>
        </div>

        <div id="obsah-menu" class="row g-3"></div>
    </section>
</main>

<footer class="pata"></footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
